name: Windows build and release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install

      - name: Check frontend
        run: npm run build

      - name: Format Rust sources
        working-directory: src-tauri
        run: cargo fmt --all

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Check Rust
        working-directory: src-tauri
        run: cargo check --target x86_64-pc-windows-msvc

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --target x86_64-pc-windows-msvc

      - name: Build Windows installers
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'OpenWallpaper ${{ github.ref_name }}'
          releaseBody: |
            OpenWallpaper Windows release.

            Install the NSIS `.exe` installer or the `.msi` package.
            Video/GIF/image/slideshow playback requires the separately installed libmpv runtime (`mpv-2.dll`).
            Read the README and SECURITY.md before use.
          releaseDraft: true
          prerelease: true
          args: --bundles nsis,msi

      - name: Build Windows bundles for manual/branch runs
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run tauri build -- --bundles nsis,msi

      - name: Smoke test Windows application startup
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          $app = Start-Process -FilePath 'src-tauri/target/release/openwallpaper.exe' -PassThru
          try {
            Start-Sleep -Seconds 10
            $app.Refresh()
            if ($app.HasExited) { throw "OpenWallpaper exited during startup smoke test (code $($app.ExitCode))" }
          }
          finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }

      - name: Upload Windows installers as workflow artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: openwallpaper-windows-installers
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

