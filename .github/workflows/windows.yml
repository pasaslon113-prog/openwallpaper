name: Windows build and release

concurrency:
  group: windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install

      - name: Bundle pinned libmpv runtime
        shell: pwsh
        run: .\\installer\\prepare-mpv.ps1

      - name: Check frontend
        run: npm run build

      - name: Format Rust sources
        working-directory: src-tauri
        run: cargo fmt --all

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Check Rust
        working-directory: src-tauri
        run: cargo check --target x86_64-pc-windows-msvc

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --target x86_64-pc-windows-msvc

      - name: Build Windows installers
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'OpenWallpaper ${{ github.ref_name }}'
          releaseBody: |
            OpenWallpaper Windows release.

            Install the NSIS `.exe` installer or the `.msi` package.
            Video/GIF/image/slideshow playback uses the bundled libmpv runtime.
            Read the README and SECURITY.md before use.
          releaseDraft: true
          prerelease: true
          args: --bundles nsis,msi

      - name: Build Windows bundles for manual/branch runs
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run tauri build -- --bundles nsis,msi

      - name: Validate bundled runtime and installed app
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          $sourceRuntime = Join-Path $PWD 'src-tauri/resources/mpv-runtime'
          $sourceDll = Join-Path $sourceRuntime 'libmpv-2.dll'
          if (-not (Test-Path -LiteralPath $sourceDll)) {
            throw "Staged libmpv DLL is missing: $sourceDll"
          }

          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class OpenWallpaperDllProbe {
              [DllImport("kernel32", SetLastError = true)]
              public static extern bool SetDefaultDllDirectories(uint flags);
              [DllImport("kernel32", CharSet = CharSet.Unicode, SetLastError = true)]
              public static extern IntPtr AddDllDirectory(string path);
              [DllImport("kernel32", CharSet = CharSet.Unicode, SetLastError = true)]
              public static extern IntPtr LoadLibrary(string path);
              [DllImport("kernel32", SetLastError = true)]
              public static extern bool FreeLibrary(IntPtr module);
              [DllImport("kernel32", SetLastError = true)]
              public static extern bool RemoveDllDirectory(IntPtr cookie);
          }
          '@

          function Test-LibMpv([string]$RuntimeDir) {
            $dllPath = Join-Path $RuntimeDir 'libmpv-2.dll'
            if (-not (Test-Path -LiteralPath $dllPath)) { throw "Bundled libmpv DLL is missing: $dllPath" }
            if (-not [OpenWallpaperDllProbe]::SetDefaultDllDirectories(0x1000)) {
              throw "SetDefaultDllDirectories failed: $([Runtime.InteropServices.Marshal]::GetLastWin32Error())"
            }
            $cookie = [OpenWallpaperDllProbe]::AddDllDirectory($RuntimeDir)
            if ($cookie -eq [IntPtr]::Zero) {
              throw "AddDllDirectory failed: $([Runtime.InteropServices.Marshal]::GetLastWin32Error())"
            }
            try {
              $module = [OpenWallpaperDllProbe]::LoadLibrary($dllPath)
              if ($module -eq [IntPtr]::Zero) {
                throw "libmpv or one of its dependencies failed to load from $RuntimeDir (Win32 $([Runtime.InteropServices.Marshal]::GetLastWin32Error()))"
              }
              [void][OpenWallpaperDllProbe]::FreeLibrary($module)
            }
            finally {
              [void][OpenWallpaperDllProbe]::RemoveDllDirectory($cookie)
            }
          }

          # First validate the staged runtime, then install the actual NSIS package.
          Test-LibMpv $sourceRuntime
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced.' }
          $installDir = Join-Path $env:TEMP 'OpenWallpaper-CI-Install'
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "NSIS installer failed with exit code $($install.ExitCode)" }

          $installedDll = Get-ChildItem -Path $installDir -Recurse -File -Filter 'libmpv-2.dll' | Select-Object -First 1
          if (-not $installedDll) { throw "Installed package does not contain libmpv-2.dll under $installDir" }
          Test-LibMpv $installedDll.DirectoryName

          $appPath = Join-Path $installDir 'openwallpaper.exe'
          if (-not (Test-Path -LiteralPath $appPath)) {
            $appPath = (Get-ChildItem -Path $installDir -Recurse -File -Filter 'openwallpaper.exe' | Select-Object -First 1).FullName
          }
          if (-not $appPath -or -not (Test-Path -LiteralPath $appPath)) { throw "Installed OpenWallpaper executable not found under $installDir" }

          $log = Join-Path $env:TEMP 'openwallpaper-startup-error.log'
          Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          $app = Start-Process -FilePath $appPath -ArgumentList '--background' -PassThru
          try {
            Start-Sleep -Seconds 10
            $app.Refresh()
            if ($app.HasExited) {
              $details = if (Test-Path -LiteralPath $log) { Get-Content -Raw -LiteralPath $log } else { 'No startup log was produced.' }
              throw "Installed OpenWallpaper exited during startup smoke test (code $($app.ExitCode)): $details"
            }
          }
          finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }


      - name: Upload Windows installers as workflow artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: openwallpaper-windows-installers
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

