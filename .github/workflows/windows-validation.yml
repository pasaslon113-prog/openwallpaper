name: Windows validation and release

on:
  push:
    branches: [main, master, ci/windows-validation]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        run: npm install
      - name: Frontend typecheck and bundle
        run: npm run build
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Build Windows installer
        run: npm run tauri build -- --bundles nsis
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OpenWallpaper-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
