<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b16">
  <title>Neon Rain · OpenWallpaper</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #080b16; }
    .city { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 68%, #40305c 0, #1b2340 29%, #0b1225 60%, #080b16 100%); }
    .rain { position: absolute; inset: -20% 0; opacity: .4; background-image: linear-gradient(102deg, transparent 47%, #91d9ff99 48%, transparent 49%), linear-gradient(102deg, transparent 48%, #f7adff88 49%, transparent 50%); background-size: 31px 110px, 49px 150px; animation: rain 1.4s linear infinite; mask-image: linear-gradient(180deg, transparent, #000 20%, #000 85%, transparent); }
    .buildings { position: absolute; left: 0; right: 0; bottom: 0; height: 49%; background: linear-gradient(90deg, #10182a 0 8%, #39405c 8.2% 8.8%, #11182a 9% 20%, #313751 20.2% 20.8%, #11182a 21% 35%, #3d3d5c 35.2% 35.8%, #11182a 36% 57%, #373c59 57.2% 57.8%, #101729 58% 76%, #343855 76.2% 76.8%, #101729 77% 91%, #303650 91.2% 91.8%, #101729 92%); clip-path: polygon(0 26%, 8% 26%, 8% 9%, 21% 9%, 21% 37%, 35% 37%, 35% 0, 47% 0, 47% 28%, 58% 28%, 58% 12%, 77% 12%, 77% 35%, 92% 35%, 92% 17%, 100% 17%, 100% 100%, 0 100%); }
    .windows { position: absolute; left: 0; right: 0; bottom: 6%; height: 39%; opacity: .78; background-image: repeating-linear-gradient(0deg, transparent 0 24px, #96ccff 25px, transparent 27px), repeating-linear-gradient(90deg, transparent 0 20px, #f2aaff 21px, transparent 23px); mask-image: linear-gradient(90deg, #000 0 8%, transparent 9% 20%, #000 21% 35%, transparent 36% 57%, #000 58% 76%, transparent 77% 91%, #000 92%); animation: flicker 6s steps(2, end) infinite; }
    .street { position: absolute; left: -10%; right: -10%; bottom: -12%; height: 42%; background: linear-gradient(180deg, #11182a, #050810); clip-path: polygon(30% 0, 70% 0, 100% 100%, 0 100%); }
    .reflection { position: absolute; left: 34%; right: 34%; bottom: 0; height: 30%; background: linear-gradient(180deg, #cf8cff00, #cf8cff88 75%, #53d9ffaa); filter: blur(24px); transform: perspective(170px) rotateX(24deg); animation: shimmer 4s ease-in-out infinite alternate; }
    @keyframes rain { to { transform: translateY(110px); } }
    @keyframes flicker { 50% { opacity: .56; } 52% { opacity: .82; } 89% { opacity: .65; } }
    @keyframes shimmer { to { transform: perspective(170px) rotateX(24deg) scaleX(.72); opacity: .55; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
</head>
<body><div class="city"></div><div class="rain"></div><div class="buildings"></div><div class="windows"></div><div class="street"></div><div class="reflection"></div></body>
</html>
