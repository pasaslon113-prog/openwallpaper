<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071321">
  <title>Aurora Drift · OpenWallpaper</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #071321; }
    .sky { position: absolute; inset: 0; background: radial-gradient(ellipse at 52% 110%, #153c4e 0, #0b2033 38%, #071321 76%); }
    .stars, .stars::before, .stars::after { position: absolute; inset: -50%; content: ""; background-image: radial-gradient(1px 1px at 15% 21%, #d9ffff 98%, transparent), radial-gradient(1px 1px at 68% 37%, #d9ffff 98%, transparent), radial-gradient(2px 2px at 81% 72%, #c5edff 98%, transparent), radial-gradient(1px 1px at 32% 81%, #fff 98%, transparent), radial-gradient(1px 1px at 52% 58%, #fff 98%, transparent), radial-gradient(1px 1px at 92% 14%, #fff 98%, transparent); background-size: 390px 330px; animation: star-drift 90s linear infinite; }
    .stars::before { opacity: .45; transform: scale(1.7); animation-duration: 135s; }
    .stars::after { opacity: .28; transform: scale(2.2); animation-duration: 180s; }
    .aurora { position: absolute; left: -18%; width: 136%; height: 54%; filter: blur(34px); opacity: .78; transform-origin: 50% 100%; }
    .aurora.one { top: 7%; background: linear-gradient(175deg, transparent 24%, #55dfb344 36%, #4bffc288 42%, #9bf5dc22 52%, transparent 72%); clip-path: polygon(0 52%, 8% 38%, 18% 44%, 28% 14%, 42% 35%, 55% 4%, 65% 30%, 78% 9%, 91% 40%, 100% 28%, 100% 100%, 0 100%); animation: curtain 17s ease-in-out infinite alternate; }
    .aurora.two { top: 18%; height: 48%; opacity: .58; background: linear-gradient(170deg, transparent 28%, #55aaff22 39%, #74c4ff77 47%, #a9ffe833 56%, transparent 70%); clip-path: polygon(0 45%, 12% 27%, 25% 41%, 36% 12%, 50% 38%, 62% 18%, 77% 39%, 89% 16%, 100% 35%, 100% 100%, 0 100%); animation: curtain 23s ease-in-out -8s infinite alternate-reverse; }
    .horizon { position: absolute; inset: 65% 0 0; background: linear-gradient(180deg, transparent, #081722 38%, #050b12); }
    .ridge { position: absolute; inset: 69% -5% -10%; background: linear-gradient(165deg, transparent 0 19%, #0d1e28 19.2% 28%, transparent 28.2%), linear-gradient(196deg, transparent 0 40%, #09151f 40.2% 54%, transparent 54.2%); opacity: .8; }
    @keyframes curtain { from { transform: translateX(-3%) skewX(-5deg) scaleY(.94); } to { transform: translateX(3%) skewX(5deg) scaleY(1.08); } }
    @keyframes star-drift { to { transform: translate3d(4%, 2%, 0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
</head>
<body><div class="sky"></div><div class="stars"></div><div class="aurora one"></div><div class="aurora two"></div><div class="horizon"></div><div class="ridge"></div></body>
</html>
